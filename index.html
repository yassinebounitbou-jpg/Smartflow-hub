<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFlow AI - Dashboard</title>
    <!-- Tailwind CSS for modern responsive UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen antialiased pb-12">

    <!-- Top Navigation Bar -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-4 py-4 md:px-8">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-lg shadow-indigo-600/30">
                    <i class="fa-solid fa-brain text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">SmartFlow AI</h1>
                    <p class="text-xs text-slate-400">Intelligent Automation & Roadmap Hub</p>
                </div>
            </div>
            <!-- API Configuration Dropdown -->
            <div class="w-full sm:w-auto">
                <div class="bg-slate-800 p-2 rounded-xl border border-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-key text-slate-400 pl-2"></i>
                    <input type="password" id="apiKeyInput" placeholder="Enter Gemini API Key..." class="bg-transparent text-sm text-slate-200 outline-none w-full sm:w-48 placeholder-slate-500">
                    <button onclick="saveApiKey()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition-all">Save</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 pt-8 md:px-8">
        
        <!-- Search & AI Generation Bar -->
        <section class="mb-10 bg-gradient-to-b from-slate-800 to-slate-900/50 p-5 md:p-8 rounded-2xl border border-slate-800 shadow-xl">
            <div class="max-w-3xl mx-auto text-center mb-6">
                <h2 class="text-lg md:text-2xl font-semibold mb-2">💡 اطلب أي خطة، فكرة، أو سفرية من الذكاء الاصطناعي</h2>
                <p class="text-xs md:text-sm text-slate-400">اكتب فكرتك بالدريجة، العربية، أو الإنجليزية وسيقوم النظام بتحليلها وتصنيفها آلياً</p>
            </div>
            <div class="max-w-3xl mx-auto flex flex-col sm:flex-row gap-3">
                <input type="text" id="aiPrompt" placeholder="مثال: بغيت ندير مشروع سيت ديال تجارة إلكترونية... أو... خطة سفر لمراكش 3 أيام..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-slate-200 text-sm md:text-base outline-none focus:border-indigo-500 transition-colors placeholder-slate-600">
                <button onclick="generateRoadmap()" id="genBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3.5 rounded-xl text-sm md:text-base transition-all flex items-center justify-center gap-2 whitespace-nowrap shadow-lg shadow-indigo-600/20">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>Générer Roadmap</span>
                </button>
            </div>
            <!-- Loading Indicator -->
            <div id="loading" class="hidden text-center mt-4 text-indigo-400 text-sm animate-pulse">
                <i class="fa-solid fa-spinner animate-spin mr-2"></i> جاري التفكير وبناء الخطة وتصنيفها...
            </div>
        </section>

        <!-- Dashboard Columns Grid (Perfectly Responsive: 1 col mobile, 3 cols desktop) -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- COLUMN 1: IDEAS -->
            <div class="bg-slate-900/50 rounded-2xl border border-slate-800/80 p-4 md:p-5">
                <div class="flex items-center gap-2.5 mb-4 pb-3 border-b border-slate-800">
                    <div class="bg-amber-500/10 text-amber-400 p-2 rounded-lg text-sm"><i class="fa-solid fa-lightbulb"></i></div>
                    <h3 class="font-bold text-base md:text-lg text-slate-200">Ideas / الأفكار</h3>
                </div>
                <div id="ideasContainer" class="space-y-4"></div>
            </div>

            <!-- COLUMN 2: PROJECTS -->
            <div class="bg-slate-900/50 rounded-2xl border border-slate-800/80 p-4 md:p-5">
                <div class="flex items-center gap-2.5 mb-4 pb-3 border-b border-slate-800">
                    <div class="bg-emerald-500/10 text-emerald-400 p-2 rounded-lg text-sm"><i class="fa-solid fa-rocket"></i></div>
                    <h3 class="font-bold text-base md:text-lg text-slate-200">Projects / المشاريع</h3>
                </div>
                <div id="projectsContainer" class="space-y-4"></div>
            </div>

            <!-- COLUMN 3: TRIPS -->
            <div class="bg-slate-900/50 rounded-2xl border border-slate-800/80 p-4 md:p-5">
                <div class="flex items-center gap-2.5 mb-4 pb-3 border-b border-slate-800">
                    <div class="bg-sky-500/10 text-sky-400 p-2 rounded-lg text-sm"><i class="fa-solid fa-plane"></i></div>
                    <h3 class="font-bold text-base md:text-lg text-slate-200">Trips & Travel / الرحلات</h3>
                </div>
                <div id="tripsContainer" class="space-y-4"></div>
            </div>

        </section>
    </main>

    <!-- Core App Logic Javascript -->
    <script>
        // Load initial setup from local storage
        document.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
            renderItems();
        });

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('gemini_api_key', key);
            alert('🚀 Key saved configuration successfully!');
        }

        async function generateRoadmap() {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                alert('⚠️ Please insert your Gemini API Key in the top configuration bar first!');
                return;
            }

            const promptInput = document.getElementById('aiPrompt').value.trim();
            if (!promptInput) return;

            const btn = document.getElementById('genBtn');
            const loading = document.getElementById('loading');
            
            btn.disabled = true;
            loading.classList.remove('hidden');

            // Structured System Instructions forcing JSON Response from Gemini 2.0 Flash
            const systemContext = `You are an AI Automation Specialist and Strategic Planner. 
            Analyze the user prompt and generate a highly professional roadmap.
            You must return a raw JSON object ONLY. Do not wrap it in markdown block quotes or fences.
            The JSON structure must strictly be:
            {
                "category": "idea" or "project" or "trip",
                "title": "A highly professional and clean title in Arabic/French based on prompt context",
                "roadmap": ["Step 1 description", "Step 2 description", "Step 3 description", "Step 4 description"]
            }
            Rules for category routing:
            - If it's about travel, vacations, exploring cities, flights, choose "trip".
            - If it's a solid business blueprint, application development, SaaS, automation setup, choose "project".
            - If it's an abstract concept, thoughts, creative logic, brainstorming, choose "idea".`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `${systemContext}\n\nUser Request: ${promptInput}` }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const jsonText = data.candidates[0].content.parts[0].text;
                const result = JSON.parse(jsonText);

                // Add date and ID timestamp
                const newItem = {
                    id: Date.now(),
                    date: new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute:'2-digit' }),
                    title: result.title,
                    category: result.category,
                    roadmap: result.roadmap
                };

                // Save to localstorage storage flow
                let currentItems = JSON.parse(localStorage.getItem('smartflow_items')) || [];
                currentItems.unshift(newItem);
                localStorage.setItem('smartflow_items', JSON.stringify(currentItems));

                document.getElementById('aiPrompt').value = '';
                renderItems();

            } catch (err) {
                alert('Error: ' + err.message);
                console.error(err);
            } finally {
                btn.disabled = false;
                loading.classList.add('hidden');
            }
        }

        function renderItems() {
            const items = JSON.parse(localStorage.getItem('smartflow_items')) || [];
            
            const containers = {
                idea: document.getElementById('ideasContainer'),
                project: document.getElementById('projectsContainer'),
                trip: document.getElementById('tripsContainer')
            };

            // Clear all columns first
            Object.values(containers).forEach(c => c.innerHTML = '');

            if(items.length === 0) {
                Object.values(containers).forEach(c => {
                    c.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">No item yet / فارغ</p>`;
                });
                return;
            }

            items.forEach(item => {
                let roadmapHtml = '';
                item.roadmap.forEach((step, idx) => {
                    roadmapHtml += `
                        <div class="flex gap-2 text-xs md:text-sm text-slate-300">
                            <span class="text-indigo-400 font-bold">${idx + 1}.</span>
                            <p>${step}</p>
                        </div>`;
                });

                const itemCard = `
                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 hover:border-slate-700 transition-all shadow-md relative group">
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <h4 class="text-sm md:text-base font-semibold text-white tracking-wide">${item.title}</h4>
                            <button onclick="deleteItem(${item.id})" class="text-slate-500 hover:text-rose-400 text-xs transition-colors p-1">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                        <span class="inline-block text-[10px] font-medium bg-slate-800 text-slate-400 px-2 py-0.5 rounded mb-3">
                            <i class="fa-regular fa-calendar-days mr-1 text-[9px]"></i> ${item.date}
                        </span>
                        <div class="space-y-2 border-t border-slate-900 pt-3">
                            ${roadmapHtml}
                        </div>
                    </div>`;

                if (containers[item.category]) {
                    containers[item.category].innerHTML += itemCard;
                }
            });

            // Put placeholder if any container remains empty after loop
            Object.keys(containers).forEach(key => {
                if(containers[key].innerHTML === '') {
                    containers[key].innerHTML = `<p class="text-xs text-slate-500 text-center py-4">No item yet / فارغ</p>`;
                }
            });
        }

        function deleteItem(id) {
            let currentItems = JSON.parse(localStorage.getItem('smartflow_items')) || [];
            currentItems = currentItems.filter(item => item.id !== id);
            localStorage.setItem('smartflow_items', JSON.stringify(currentItems));
            renderItems();
        }
    </script>
</body>
</html>
